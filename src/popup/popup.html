<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Page Monitor</title>
    <style>
        body
        {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 12px;
            min-width: 250px;
        }

        .row
        {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        #status
        {
            margin-bottom: 12px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        #songCount
        {
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #0066cc;
        }

        .button-group
        {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button
        {
            padding: 8px 12px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button:hover
        {
            background: #0052a3;
        }

        button:disabled
        {
            background: #ccc;
            cursor: not-allowed;
        }

        button.secondary
        {
            background: #666;
        }

        button.secondary:hover
        {
            background: #555;
        }

        .success-message
        {
            color: #28a745;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
<div class="row">
    <label>
        <input type="checkbox" id="monitorToggle"/>
        Monitor this page
    </label>
</div>
<div id="status">Monitoring is off for this page.</div>
<div id="songCount">Songs collected: 0</div>

<div class="button-group">
    <button id="exportButton" disabled>Copy Songs to Clipboard</button>
    <button id="clearButton" class="secondary" disabled>Clear Collected Songs</button>
</div>

<div id="successMessage" class="success-message">Copied to clipboard!</div>

<script src="popup.js"></script>
</body>
</html>
