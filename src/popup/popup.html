<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Page Monitor</title>
    <style>
        body
        {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 8px 12px;
            min-width: 220px;
        }

        .row
        {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status
        {
            margin-top: 8px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
<div class="row">
    <label>
        <input type="checkbox" id="monitorToggle"/>
        Monitor this page
    </label>
</div>
<div id="status">Monitoring is off for this page.</div>

<script src="popup.js"></script>
</body>
</html>
